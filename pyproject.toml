[project]
name = "epuap-auto-sign"
version = "0.1.0"
description = "Automatyzacja podpisywania dokumentow PDF podpisem zaufanym przez podpis.gov.pl"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "epuap-auto-sign contributors" },
]
keywords = ["podpis-zaufany", "profil-zaufany", "epuap", "pdf", "signature", "gov.pl"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
    "Natural Language :: Polish",
]
dependencies = [
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
epuap-sign = "epuap_auto_sign.cli:main"

[project.urls]
Funding = "https://buymeacoffee.com/mpasternak"
Homepage = "https://github.com/mpasternak/epuap-auto-sign"
Repository = "https://github.com/mpasternak/epuap-auto-sign"
Issues = "https://github.com/mpasternak/epuap-auto-sign/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/epuap_auto_sign"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line-length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.9",
]
